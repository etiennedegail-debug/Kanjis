<script>
// Hors de claude.ai, window.storage n'existe pas : on fournit la même interface sur localStorage.
if (!window.storage) {
  window.storage = {
    async get(k)    { const v = localStorage.getItem(k);
                      if (v === null) throw new Error("clé absente");
                      return { key: k, value: v, shared: false }; },
    async set(k, v) { localStorage.setItem(k, v); return { key: k, value: v, shared: false }; },
    async delete(k) { localStorage.removeItem(k); return { key: k, deleted: true }; },
    async list(p)   { const ks = Object.keys(localStorage).filter(x => !p || x.startsWith(p));
                      return { keys: ks, prefix: p, shared: false }; }
  };
}
// Enregistrement du service worker : sans lui, pas de fonctionnement hors ligne.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("./sw.js").catch(e => console.warn("SW:", e)));
}
</script>
<style>

    --paper:      #FBFBF9;
    --paper-edge: #EDEDE8;

  * { box-sizing: border-box; }
  #app {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--sumi); max-width: 480px; margin: 0 auto; padding: 4px 0 24px;

  .mincho { font-family: "Hiragino Mincho ProN","Yu Mincho",YuMincho,"Noto Serif JP","MS PMincho",serif; }

  .cell-wrap { display:flex; justify-content:center; margin-bottom:6px; }
  .cell { position:relative; width:208px; height:208px; background:var(--paper);
    border:1.5px solid var(--grid); display:grid; place-items:center; }
  .cell::before, .cell::after { content:""; position:absolute; }
  .cell::before { left:50%; top:6%; bottom:6%; width:1px; transform:translateX(-.5px);

  .cell::after { top:50%; left:6%; right:6%; height:1px; transform:translateY(-.5px);
    background:repeating-linear-gradient(to right,var(--grid) 0 5px,transparent 5px 11px); }
  .cell .glyph { position:relative; z-index:1; font-size:118px; line-height:1; color:var(--sumi); }

  .cell .prompt strong { color:var(--sumi); font-size:19px; display:block; margin-bottom:4px; }

  /* ---- tracé animé ---- */
  .cell svg.strokes-svg { position:absolute; inset:0; width:100%; height:100%; z-index:2; }
  .cell svg.strokes-svg path {
    fill:none; stroke:var(--sumi); stroke-width:4.2;
    stroke-linecap:round; stroke-linejoin:round;

  .cell svg.strokes-svg path.ghost { stroke:var(--grid-faint); stroke-width:4.2; }

  .btn-trace {

  .btn-trace:hover { background:#EDF3F7; }

  .mode-ecriture { background:#F7E9E5; color:var(--shu); }

  .reveal { border-top:1px dashed var(--paper-edge); padding-top:16px; margin-top:4px; }
  .reveal .rdg { font-size:19px; margin-bottom:2px; letter-spacing:.02em; }

    border-left:2px solid var(--grid); padding:10px 12px; }
  .reveal .lesson { font-size:11px; color:var(--sumi-soft); margin-top:10px; }

  button { font:inherit; cursor:pointer; border-radius:3px; transition:transform 90ms ease, background 140ms ease; }
  button:active { transform:translateY(1px); }
  button:focus-visible { outline:2px solid var(--shu); outline-offset:2px; }
  .btn-show { width:100%; padding:13px; background:var(--ai); color:#fff; border:none;

  .btn-show:hover { background:#1D3549; }
  .btn-show .hint { opacity:.55; font-size:12px; margin-left:8px; }

  .grades { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:16px; }

  .g-hard:hover { background:#FCF6E9; border-color:#C99A22; color:#8A6A12; }
  .g-good:hover { background:#EAF2EC; border-color:#4A7C57; color:#2F5A3A; }

  .done { text-align:center; padding:26px 0 10px; }
  .hanko { width:92px; height:92px; margin:0 auto 22px; border:3.5px solid var(--shu);

  .done p { font-size:14px; color:var(--sumi-soft); line-height:1.6; margin:0 auto; max-width:300px; }

  .box { flex:1; text-align:center; padding:7px 2px; background:#F4F6F7; border-radius:2px; }

  .box .d { font-size:9px; color:var(--sumi-soft); letter-spacing:.06em; margin-top:1px; }

  .msg { font-size:12px; color:var(--shu); min-height:16px; margin-top:8px; }

  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>

const today = () => Math.floor(Date.now() / DAYMS);

let state = { progress: {}, day: null, seen: 0, order: null };
let queue = [], current = null, revealed = false, mode = "lecture";
const app = document.getElementById("app");

// ---------- ordre d'introduction : aléatoire, mais pas n'importe comment ----------
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildIntroOrder() {
  const ids = shuffle(CARDS.map(c => c.id));
  const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  const gap = Math.max(2, Math.min(NEW_PER_DAY + 4, Math.floor(ids.length / 3)));

  const pairs = CONFUSABLES
    .map(([a, b]) => [CARDS.find(c => c.k === a), CARDS.find(c => c.k === b)])
    .filter(([a, b]) => a && b)
    .map(([a, b]) => [a.id, b.id]);

  // on écarte les paires confusables, par déplacements successifs
  for (let pass = 0; pass < 40; pass++) {
    let moved = false;
    for (const [x, y] of pairs) {
      const i = ids.indexOf(x), j = ids.indexOf(y);
      if (i < 0 || j < 0) continue;
      if (Math.abs(i - j) >= gap) continue;
      const later = Math.max(i, j);
      const target = Math.min(ids.length - 1, Math.min(i, j) + gap);
      ids.splice(target, 0, ids.splice(later, 1)[0]);
      moved = true;
    }
    if (!moved) break;
  }
  return ids;
}

// ---------- stockage ----------
async function load() {
  try {
    const r = await window.storage.get(KEY);
    if (r && r.value) state = JSON.parse(r.value);
  } catch (e) { /* premier lancement */ }
  if (!state.progress) state.progress = {};
  if (!state.order || state.order.length !== CARDS.length) state.order = buildIntroOrder();
  if (state.day !== today()) { state.day = today(); state.seen = 0; }
}
async function save() {
  try { await window.storage.set(KEY, JSON.stringify(state)); }
  catch (e) {
    const m = document.querySelector(".msg");
    if (m) m.textContent = "Progression non sauvegardée — recharge la page.";
  }
}

// ---------- file du jour ----------
function buildQueue() {
  const t = today();
  const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
  const due = CARDS.filter(c => state.progress[c.id] && state.progress[c.id].due <= t);
  const fresh = state.order.map(id => byId[id]).filter(c => c && !state.progress[c.id]);

  // combien de nouveaux déjà introduits aujourd'hui (l'appli peut être rouverte en cours de jour)
  const dejaNeufs = Object.values(state.progress).filter(p => p.first === t).length;
  const neufs = fresh.slice(0, Math.max(0, NEW_PER_DAY - dejaNeufs));

  // les nouveaux ont des places réservées : sinon les rappels les affament
  // et l'introduction des 88 s'étale jusqu'à la mi-août au lieu de début août.
  const room = Math.max(0, DAILY_CAP - state.seen);
  const placeRappels = Math.max(0, room - neufs.length);
  queue = shuffle([...neufs, ...shuffle(due).slice(0, placeRappels)]);
}

function grade(g) {
  const p = state.progress[current.id] || { box: 0, seen: 0, first: today() };
  if (g === "good") p.box = Math.min(p.box + 1, INTERVALS.length - 1);
  else if (g === "fail") p.box = 0;
  p.seen = (p.seen || 0) + 1;
  p.due = today() + INTERVALS[p.box];
  state.progress[current.id] = p;
  state.seen++;
  if (g === "fail") queue.push(current);
  save();
  next();
}

function next() {
  revealed = false;
  current = queue.shift() || null;
  if (current) mode = current.ecriture && Math.random() < 0.4 ? "ecriture" : "lecture";
  render();
}

// ---------- animation du tracé ----------
function traceSVG(kanji) {
  const paths = STROKES[kanji];
  if (!paths) return "";
  const ghosts = paths.map(d => `<path class="ghost" d="${d}"/>`).join("");
  const live   = paths.map(d => `<path class="live" d="${d}"/>`).join("");
  return `<svg class="strokes-svg" viewBox="0 0 109 109" aria-label="Ordre des traits">${ghosts}${live}</svg>`;
}

function runTrace() {
  const svg = document.querySelector(".strokes-svg");
  if (!svg) return;
  const btn = document.querySelector(".btn-trace");
  const paths = [...svg.querySelectorAll("path.live")];
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  paths.forEach(p => {
    const L = p.getTotalLength();
    p.style.transition = "none";
    p.style.strokeDasharray = L;
    p.style.strokeDashoffset = reduce ? 0 : L;
  });
  if (reduce) return;

  if (btn) btn.disabled = true;
  let i = 0;
  (function drawNext() {
    if (i >= paths.length) { if (btn) btn.disabled = false; return; }
    const p = paths[i];
    const L = p.getTotalLength();
    const dur = Math.max(240, Math.min(760, L * 8));
    requestAnimationFrame(() => {
      p.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(.4,.1,.5,1)`;
      p.style.strokeDashoffset = 0;
    });
    i++;
    setTimeout(drawNext, dur + 130);
  })();
}

function showTrace() {
  const cell = document.querySelector(".cell");
  if (!cell || cell.dataset.tracing === "1") { runTrace(); return; }
  cell.dataset.tracing = "1";
  const glyph = cell.querySelector(".glyph");
  if (glyph) glyph.style.display = "none";
  cell.insertAdjacentHTML("beforeend", traceSVG(current.k));
  runTrace();
}

// ---------- rendu ----------
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m])); }

function header() {
  const total = Math.min(DAILY_CAP, state.seen + queue.length + (current ? 1 : 0));
  let pips = "";
  for (let i = 0; i < total; i++)
    pips += `<div class="pip ${i < state.seen ? "done" : (i === state.seen ? "now" : "")}"></div>`;
  const n = CARDS.length;
  const known = CARDS.filter(c => state.progress[c.id]).length;
  return `<header><div class="title">漢字 <span>· ${known}/${n} entamés</span></div>
    <div class="pips">${pips}</div></header>`;
}

function boxMap() {
  const counts = [0,0,0,0,0];
  let untouched = 0;
  for (const c of CARDS) {
    const p = state.progress[c.id];
    if (!p) untouched++; else counts[p.box]++;
  }
  return `<div class="boxes"><div class="label">Où en sont tes kanji</div>
    <div class="boxrow">
      <div class="box"><div class="n">${untouched}</div><div class="d">JAMAIS VUS</div></div>
      ${counts.map((n,i)=>`<div class="box"><div class="n">${n}</div><div class="d">+${INTERVALS[i]}J</div></div>`).join("")}
    </div></div>`;
}

const CREDIT = `<div class="foot">
  Tracés : <a href="http://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a>
  (Ulrich Apel), licence CC BY-SA 3.0.
  <br><br><button onclick="reset()">Tout réinitialiser</button>
  <div class="msg"></div></div>`;

function doneView() {
  const t = today();
  const tomorrow = CARDS.filter(c => state.progress[c.id] && state.progress[c.id].due === t + 1).length;
  return `${header()}
    <div class="done">
      <div class="hanko mincho">済</div>
      <h2>Terminé pour aujourd'hui.</h2>
      <p>${state.seen} kanji revus. Ferme l'appli — le travail est fait.
      ${tomorrow ? `<br><br>${tomorrow} reviennent demain.` : ""}</p>
    </div>
    ${boxMap()}${CREDIT}`;
}

function cardView() {
  const c = current, isEcr = mode === "ecriture";
  const inner = (isEcr && !revealed)
    ? `<div class="prompt"><strong>${esc(c.sens)}</strong>${esc(c.kunR || c.onR)}</div>`
    : `<div class="glyph mincho">${esc(c.k)}</div>`;

  const traceBtn = (revealed || !isEcr)
    ? `<button class="btn-trace" onclick="showTrace()">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 L20 4"/><path d="M15 4h5v5"/></svg>
         Ordre des traits
       </button>`
    : "";

  const bar = `<div class="stroke-bar">
      <span class="strokes-count">${c.traits} traits</span>${traceBtn}</div>`;

  const rd = [];
  if (c.kun) rd.push(`<span class="mincho">${esc(c.kun)}</span> <span class="rom">(${esc(c.kunR)})</span>`);
  if (c.on)  rd.push(`<span class="on mincho">${esc(c.on)}</span> <span class="rom">(${esc(c.onR)})</span>`);

  const body = revealed
    ? `<div class="reveal">
         <div class="rdg">${rd.join(" &nbsp;·&nbsp; ")}</div>
         <div class="sens">${esc(c.sens)}</div>
         <div class="ex mincho">${esc(c.ex)}</div>
         <div class="lesson">Leçon ${c.lecons.join(" puis ")} · fiche p. ${c.page}${c.note ? `<br><span style="color:var(--shu)">⚑ ${esc(c.note)}</span>` : ""}</div>
       </div>
       <div class="grades">
         <button class="g-fail" onclick="grade('fail')">Raté<span class="k">1</span></button>
         <button class="g-hard" onclick="grade('hard')">Difficile<span class="k">2</span></button>
         <button class="g-good" onclick="grade('good')">Su<span class="k">3</span></button>
       </div>`
    : `<button class="btn-show" onclick="reveal()">
         ${isEcr ? "Vérifier mon tracé" : "Montrer"}<span class="hint">espace</span></button>`;

  return `${header()}
    <div class="center">
      <span class="mode-tag ${isEcr ? "mode-ecriture" : "mode-lecture"}">
        ${isEcr ? "Écriture — trace-le sur papier" : "Lecture"}</span>
    </div>
    <div class="cell-wrap"><div class="cell">${inner}</div></div>
    ${bar}${body}<div class="msg"></div>`;
}

function render() { app.innerHTML = current ? cardView() : doneView(); }
function reveal() { revealed = true; render(); }

async function reset() {
  state = { progress: {}, day: today(), seen: 0, order: buildIntroOrder() };
  await save(); buildQueue(); next();
}

document.addEventListener("keydown", e => {
  if (!current) return;
  if (e.code === "Space") { e.preventDefault(); if (!revealed) reveal(); return; }
  if (e.key === "t" || e.key === "T") { showTrace(); return; }
  if (!revealed) return;
  if (e.key === "1") grade("fail");
  if (e.key === "2") grade("hard");
  if (e.key === "3") grade("good");
});

(async function init() { await load(); buildQueue(); next(); })();
</script>

</body>
</html>
